<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GigaCM Portal</title>
<style>
:root{--bg:#0d0f11;--panel:#15181c;--panel2:#1b1f24;--line:#262b32;--text:#e8eaed;--mute:#8b949e;--acc:#c8f560;--red:#ff6b6b;--amb:#f5b942;--grn:#5ad68a;--blu:#6cb6ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;grid-template-columns:200px 1fr;min-height:100vh}
.num,td.n,th.n{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
nav{border-right:1px solid var(--line);padding:18px 10px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:2px}
.brand{font-weight:700;letter-spacing:.02em;padding:0 10px 14px;font-size:15px}.brand b{color:var(--acc)}
nav a{color:var(--mute);text-decoration:none;padding:8px 10px;border-radius:7px;display:flex;justify-content:space-between;align-items:center}
nav a:hover{color:var(--text);background:var(--panel)}nav a.on{color:var(--bg);background:var(--acc);font-weight:600}
.badge{background:var(--red);color:#fff;border-radius:9px;font-size:11px;padding:0 6px;font-weight:700}nav a.on .badge{background:var(--bg)}
nav .foot{margin-top:auto;color:var(--mute);font-size:12px;padding:10px}
main{padding:18px 24px 60px;min-width:0}
header{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
h1{font-size:20px;margin:0;flex:1}h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin:26px 0 10px;font-weight:600}
.sample{background:#3a2f0f;border:1px solid #6b5514;color:var(--amb);padding:8px 12px;border-radius:8px;margin-bottom:14px;font-size:13px}
button,select,input,textarea{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:6px 10px}
button{cursor:pointer}button:hover{border-color:var(--mute)}button.pri{background:var(--acc);color:var(--bg);border-color:var(--acc);font-weight:600}
button.sm{padding:3px 8px;font-size:12px}button:disabled{opacity:.45;cursor:default}
textarea{width:100%;min-height:64px;resize:vertical}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi .v{font-size:26px;font-weight:700}.kpi .l{color:var(--mute);font-size:12px}
.cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.card h3{margin:0 0 8px;font-size:15px;display:flex;gap:8px;align-items:center}
.tag{font-size:11px;padding:1px 7px;border-radius:9px;border:1px solid var(--line);color:var(--mute);font-weight:500;white-space:nowrap}
.tag.red{color:var(--red);border-color:#5a2a2a}.tag.amb{color:var(--amb);border-color:#5a4a1e}.tag.grn{color:var(--grn);border-color:#1f4a31}.tag.blu{color:var(--blu);border-color:#1f3a55}.tag.acc{color:var(--acc);border-color:#4c5a25}
.row{display:flex;justify-content:space-between;padding:3px 0;color:var(--mute)}.row b{color:var(--text);font-weight:600}
.red{color:var(--red)}.amb{color:var(--amb)}.grn{color:var(--grn)}.mute{color:var(--mute)}
.spark{display:flex;align-items:flex-end;gap:2px;height:34px;margin-top:10px}.spark i{flex:1;background:var(--acc);opacity:.8;border-radius:1px;min-height:1px}.spark i.z{background:var(--line)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
table{border-collapse:collapse;width:100%}th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mute);font-size:12px;font-weight:500;position:sticky;top:0;background:var(--panel)}tr:last-child td{border-bottom:0}td.n,th.n{text-align:right}
td.wrap{white-space:normal;min-width:220px}
.msg{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.msg.sent{opacity:.5}.msg .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.msg .q{border-left:3px solid var(--line);padding:2px 10px;margin:6px 0 10px;color:#cfd3d8}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{cursor:pointer;user-select:none}.chip.on{background:var(--acc);color:var(--bg);border-color:var(--acc)}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 16px;border-radius:8px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
#toast.on{opacity:1}
.prog{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:14px}
.prog .top{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}.prog .top b{font-weight:600}
.prog .track{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden;margin-top:8px}
.prog .fill{height:100%;background:var(--acc);border-radius:3px;transition:width .9s linear}
.prog.done .fill{background:var(--grn)}.prog.late .fill{background:var(--amb)}
.steps{display:flex;gap:14px;margin-top:6px;font-size:12px;color:var(--mute);flex-wrap:wrap}.steps .ok{color:var(--grn)}.steps .now{color:var(--text);font-weight:600}
a.dl{color:var(--blu);text-decoration:none;font-size:12px;white-space:nowrap}a.dl:hover{text-decoration:underline}
@media(max-width:760px){body{grid-template-columns:1fr}nav{position:static;height:auto;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px}.brand,nav .foot{display:none}nav a{white-space:nowrap;gap:6px}main{padding:14px}}
</style>
</head>
<body>
<nav id="nav"></nav>
<main>
  <header><h1 id="title"></h1><span class="mute" id="stamp"></span><button id="refresh">↻ Refresh now</button></header>
  <div id="progress"></div>
  <div id="banner"></div>
  <div id="view"></div>
</main>
<div id="toast"></div>
<script>
const VIEWS=[['today','Today'],['capcut','CapCut inbox'],['artlist','Artlist inbox'],['creatify','Creatify inbox'],['melius','Melius inbox'],['coaches','Coaches'],['creators','Creators & flags'],['slack','Slack & DMs'],['audits','Audits']];
const TEMPLATES={
  checkin:{label:'Daily check-in',text:'Hey {first}, how many posts you getting out today?'},
  missed:{label:'Missed yesterday',text:"Hey {first}, I didn't see a post from you yesterday. Everything good? What's the plan to get back on track today?"},
  scale:{label:'Offer 5/day',text:'Hey {first}, your CPM is sitting under the campaign target, nice work. Want to bump from 3 posts a day to 5?'},
  custom:{label:'Custom…',text:''}
};
const runnerAge=()=>S.runner&&S.runner.lastPollAt?(Date.now()-new Date(S.runner.lastPollAt))/60000:null;
const fireMsg=()=>!live?'Rescan queued (preview)':runnerAge()!=null&&runnerAge()<2?'Queued. The Mac Mini picks it up within 30 seconds.':'Queued, but the Mac Mini has not checked in recently, so it will run once it is back online.';
let S={campaigns:[],slack:[],audits:[],queue:[]}, live=false, localQueue=[], sentIds=new Set();
let T={cutCpmMult:1.5,minResp:50,minVolPct:50,lowViews:200};
let F={camp:'all',flag:'all'};
try{Object.assign(T,JSON.parse(localStorage.getItem('gk_thresholds')||'{}'))}catch(e){}

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const wait=m=>m<60?m+'m':m<1440?Math.floor(m/60)+'h '+(m%60)+'m':Math.floor(m/1440)+'d '+Math.floor(m%1440/60)+'h';
const waitCls=m=>m>=300?'red':m>=120?'amb':'';
const money=n=>n==null?'—':'$'+Number(n).toFixed(2);
const fmtN=n=>n>=1e6?(n/1e6).toFixed(2)+'M':n>=1e3?(n/1e3).toFixed(1)+'k':String(n);
const ago=iso=>{if(!iso)return'never';const m=Math.max(0,Math.round((Date.now()-new Date(iso))/60000));return m<1?'just now':wait(m)+' ago'};
const camp=id=>S.campaigns.find(c=>c.id===id);
const GUILD={capcut:'1569756845319520387',artlist:'1570552478817067038',creatify:'1562201369811877949',melius:'1559661121588306052'};
// Link to the exact message when the scan recorded its id, otherwise to the channel.
const msgUrl=(c,u)=>{const g=(c&&(c.guildId||GUILD[c.id]));if(!g||!/^\d+$/.test(String(u.channelId||'')))return null;return 'https://discord.com/channels/'+g+'/'+u.channelId+(/^\d+$/.test(String(u.messageId||''))?'/'+u.messageId:'')};
const dmUrl=m=>/^\d+$/.test(String(m.id||''))?'https://discord.com/channels/@me/'+m.id+(/^\d+$/.test(String(m.messageId||''))?'/'+m.messageId:''):null;
const openLink=(url,exact)=>url?`<a class="dl" href="${esc(url)}" target="_blank" rel="noopener">${exact?'Open message in Discord ↗':'Open channel in Discord ↗'}</a>`:'';
const waitingOn=c=>c?(c.id==='capcut'?pendingUn(c):c.unanswered):[];
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2600)}

function flags(c,x){
  const f=[];
  if(!x.inDiscord)f.push({k:'nodiscord',t:'Not in Discord',c:'blu'});
  const posted=x.everPosted!==false;
  if(!posted)f.push({k:'noposts',t:'No posts yet · day '+(x.daysOnCampaign||'?'),c:x.daysOnCampaign>5?'red':'blu'});
  if(posted&&x.postsYesterday===0)f.push({k:'missed',t:'Missed yesterday · message',c:'red'});
  if(posted&&x.postsToday===0)f.push({k:'today',t:'No post today',c:'amb'});
  const redA=(x.accounts||[]).filter(a=>a.health==='red');
  if(redA.length)f.push({k:'health',t:'Account health red: '+redA.map(a=>a.platform).join(', '),c:'amb'});
  const low=(x.accounts||[]).filter(a=>a.avgViews!=null&&a.avgViews<T.lowViews);
  if(low.length)f.push({k:'lowviews',t:'Low-view account: '+low.map(a=>a.platform+' '+a.avgViews).join(', '),c:'amb'});
  const cut=[];
  if(!posted&&x.daysOnCampaign>5)cut.push('no first post in '+x.daysOnCampaign+' days');
  if(x.cpm!=null&&x.posts7d>=5&&x.cpm>c.targetCpm*T.cutCpmMult)cut.push('CPM '+money(x.cpm));
  if(x.responseRate!=null&&x.responseRate<T.minResp)cut.push('replies '+x.responseRate+'%');
  const exp=x.expectedPerDay*Math.min(7,x.daysOnCampaign||7);
  if(posted&&x.posts7d<exp*T.minVolPct/100)cut.push('volume '+x.posts7d+'/'+exp);
  if(cut.length)f.push({k:'cut',t:'Cut? '+cut.join(', '),c:'red'});
  if(x.cpm!=null&&x.cpm<c.targetCpm&&x.postsYesterday>=x.expectedPerDay)f.push({k:'scale',t:'Under target CPM · offer 5/day',c:'grn'});
  return f;
}
const all=()=>S.campaigns.flatMap(c=>c.creators.map(x=>({c,x,f:flags(c,x)})));
const has=(r,k)=>r.f.some(f=>f.k===k);
const pendingUn=c=>{const m=c.unanswered.filter(u=>/^Ty\b/.test(u.coach||''));return (m.length||c.unanswered.some(u=>/^Ty\b/.test(u.coach||''))?m:c.unanswered).filter(u=>!sentIds.has(u.id))};

async function load(){
  try{const r=await fetch('api/state',{cache:'no-store'});if(!r.ok)throw 0;S=await r.json();live=true}
  catch(e){try{S=await(await fetch('state.json')).json()}catch(e2){S={campaigns:[],slack:[],audits:[]}}live=false}
  S.queue=S.queue||[];S.slack=S.slack||[];S.audits=S.audits||[];S.campaigns.forEach(c=>{c.unanswered=c.unanswered||[];c.coaches=c.coaches||[];c.creators=c.creators||[];
    if(c.discord){const ch=c.discord.channels||{},cs=c.discord.coachStats||{},byCh={};
      c.creators.forEach(x=>{const d=x.channelId&&ch[x.channelId];if(d){x.coach=d.coach;x.responseRate=d.responseRate;x.channel='#'+d.name;byCh[x.channelId]=x}else if(x.coach==='Unassigned'||!c.discordScannedAt){}else x.coach='Unassigned'});
      c.unanswered.forEach(u=>{const x=byCh[u.channelId];if(x){u.creator=x.name;u.creatorId=x.id}});
      const names=[...new Set([...Object.keys(cs),...c.creators.map(x=>x.coach)])];
      c.coaches=names.map(n=>{const un=c.unanswered.filter(u=>u.coach===n);return {name:n,creators:c.creators.filter(x=>x.coach===n).length,medianResponseMin:cs[n]?cs[n].medianResponseMin:null,replies7d:cs[n]?cs[n].replies7d:null,unanswered:un.length,oldestUnansweredMin:un.reduce((m,u)=>Math.max(m,u.waitingMin),0),missedCheckins7d:null,strikes:null}}).sort((a,b)=>b.creators-a.creators)}});render();
}
async function act(list){
  if(live){
    try{const r=await fetch('api/actions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(list)});
      const j=await r.json();if(!r.ok)throw new Error(j.error);await load();return true}
    catch(e){toast('Failed: '+e.message);return false}
  }
  list.forEach(a=>localQueue.push({...a,id:'p'+Math.random(),status:'preview',createdAt:new Date().toISOString()}));
  return true;
}
const queue=()=>(live?S.queue:localQueue).slice().reverse();
const fill=(t,name)=>t.replaceAll('{first}',name.split(' ')[0]);

function render(){
  const v=(location.hash||'#today').slice(1), cc=camp('capcut');
  const badges={capcut:cc?pendingUn(cc).length:0,artlist:waitingOn(camp('artlist')).length,creatify:waitingOn(camp('creatify')).length,melius:waitingOn(camp('melius')).length,slack:S.slack.length+(S.dms||[]).length};
  $('#nav').innerHTML='<div class="brand"><b>Giga</b>CM Portal</div>'+VIEWS.map(([k,l])=>`<a href="#${k}" class="${k===v?'on':''}">${l}${badges[k]?`<span class="badge">${badges[k]}</span>`:''}</a>`).join('')+`<div class="foot">Scans run on the Mac Mini via Claude in Chrome${live&&S.runner&&S.runner.lastPollAt?`<br>${runnerAge()<2?'<span class="grn">● Mac Mini online</span>':'<span class="amb">● Mac Mini last seen '+ago(S.runner.lastPollAt)+'</span>'}`:''}</div>`;
  $('#title').textContent=(VIEWS.find(x=>x[0]===v)||VIEWS[0])[1];
  $('#stamp').textContent='Last scan '+ago(S.generatedAt);
  $('#banner').innerHTML=S.sample?'<div class="sample"><b>Sample data.</b> Names and numbers are made up to show the layout. Buttons queue actions here but nothing is sent.</div>':'';
  $('#view').innerHTML=({today:vToday,capcut:vCapcut,artlist:()=>vInbox('artlist'),creatify:()=>vInbox('creatify'),melius:()=>vInbox('melius'),coaches:vCoaches,creators:vCreators,slack:vSlack,audits:vAudits}[v]||vToday)();
  renderProgress();
}

function vToday(){
  const rows=all(), cc=camp('capcut'), mine=rows.filter(r=>r.c.id==='capcut');
  const k=(v,l,cls='')=>`<div class="kpi"><div class="v num ${cls}">${v}</div><div class="l">${l}</div></div>`;
  let h='<div class="grid">'+
    k(cc?pendingUn(cc).length:0,'CapCut creators waiting on a reply','red')+
    k(S.slack.length+(S.dms||[]).length,'Slack messages and Discord DMs to answer','amb')+
    k(mine.filter(r=>has(r,'missed')).length,'CapCut missed yesterday')+
    k(rows.filter(r=>!r.x.inDiscord).length,'In LaunchPoint but not in Discord','blu')+
    k(S.campaigns.reduce((s,c)=>s+(c.role==='cm'?0:c.unanswered.length),0),'Unanswered on oversight campaigns')+
    k(rows.filter(r=>has(r,'cut')).length,'Cut candidates (all campaigns)')+
    k(rows.filter(r=>has(r,'lowviews')).length,'Creators with an account under '+T.lowViews+' avg views','amb')+
    k(rows.filter(r=>has(r,'scale')).length,'Ready for 5/day','grn')+'</div><h2>Cohort performance today</h2><div class="cards">';
  for(const c of S.campaigns){
    const posted=c.creators.filter(x=>x.postsToday>0).length, posts=c.creators.reduce((s,x)=>s+x.postsToday,0), exp=c.creators.length*c.expectedPerDay;
    const missed=c.creators.filter(x=>x.everPosted!==false&&x.postsYesterday===0).length, never=c.creators.filter(x=>x.everPosted===false).length, old=c.unanswered.reduce((m,u)=>Math.max(m,u.waitingMin),0);
    const bars=c.postsByDay?c.postsByDay.map(d=>d.posts):(c.postsByHourToday||[]), mx=Math.max(1,...bars.map(n=>n||0));
    h+=`<div class="card"><h3>${esc(c.name)} <span class="tag ${c.role==='cm'?'acc':''}">${c.role==='cm'?'You CM':'Oversight'}</span><span style="flex:1"></span><button class="sm" data-rescan="${esc(c.id)}">↻</button></h3>
    <div class="row"><span>CPM (7d) vs target</span><b class="num ${c.cpm>c.targetCpm?'red':'grn'}">${money(c.cpm)} / ${money(c.targetCpm)}</b></div>
    <div class="row"><span>CPM all-time</span><b class="num ${c.cpmAllTime==null?'':c.cpmAllTime>c.targetCpm?'red':'grn'}">${money(c.cpmAllTime)}${c.viewsAllTime!=null?` <span class="mute" style="font-weight:400">· ${fmtN(c.viewsAllTime)} views</span>`:''}</b></div>
    <div class="row"><span>Creators posted today</span><b class="num">${posted} / ${c.creators.length}</b></div>
    <div class="row"><span>Posts today vs expected</span><b class="num">${posts} / ${exp}</b></div>
    <div class="row"><span>Missed yesterday</span><b class="num ${missed?'red':''}">${missed}</b></div>
    <div class="row"><span>Active but never posted</span><b class="num">${never}</b></div>
    <div class="row"><span>Unanswered creators</span><b class="num ${c.unanswered.length?'amb':''}">${c.discordScannedAt||S.sample?c.unanswered.length+(old?` · oldest ${wait(old)}`:''):'not scanned'}</b></div>
    <div class="row"><span>Not in Discord</span><b class="num">${c.creators.filter(x=>!x.inDiscord).length}</b></div>
    <div class="spark" title="${c.postsByDay?c.postsByDay.map(d=>d.date.slice(5)+': '+d.posts).join(' · '):'Posts per hour today'}">${bars.map(n=>`<i class="${n?'':'z'}" style="height:${n?Math.round(n/mx*100):3}%"></i>`).join('')}</div>
    <div class="mute" style="font-size:11px;margin-top:4px">${c.postsByDay?'Posts per day, last 7 days':'Posts by hour'} · LaunchPoint scanned ${ago(c.scannedAt)}${c.discordScannedAt?' · Discord '+ago(c.discordScannedAt):c.sample===undefined&&!S.sample?' · Discord not scanned yet':''}</div></div>`;
  }
  return h+'</div>';
}

function vCapcut(){
  const c=camp('capcut'); if(!c)return '<p class="mute">No CapCut data yet.</p>';
  const rows=c.creators.map(x=>({c,x,f:flags(c,x)})), un=c.unanswered.slice().sort((a,b)=>b.waitingMin-a.waitingMin);
  const mine=u=>/^Ty\b/.test(u.coach||''), hasMine=un.some(mine);
  let h='';
  for(const [label,list] of hasMine?[['Your creators waiting on you',un.filter(mine)],["Other coaches' creators waiting",un.filter(u=>!mine(u))]]:[['Needs a response',un]]){
  h+=`<h2>${label} (${list.filter(u=>!sentIds.has(u.id)).length})</h2>`;
  if(!list.length)h+='<p class="mute">Everyone has been answered.</p>';
  for(const u of list){const done=sentIds.has(u.id);
    h+=`<div class="msg ${done?'sent':''}"><div class="top"><b>${esc(u.creator)}</b><span class="tag">${esc(u.channel)}</span><span class="tag">${esc(u.coach)}</span><span class="num ${waitCls(u.waitingMin)}">waiting ${wait(u.waitingMin)}</span><span style="flex:1"></span>${openLink(msgUrl(c,u),!!u.messageId)}${u.channelId?`<button class="sm" data-recheck="${esc(u.channelId)}">Recheck channel</button>`:""}</div>
    ${u.context?`<div class="mute" style="font-size:12px">Last from coach: ${esc(u.context)}</div>`:''}<div class="q">${esc(u.message)}</div>
    <textarea id="d_${esc(u.id)}" ${done?'disabled':''}>${esc(u.draft||'')}</textarea>
    <div class="bar"><button class="pri" data-reply="${esc(u.id)}" ${done?'disabled':''}>${done?'Queued':'Send reply in Discord'}</button><span class="mute" style="font-size:12px">${u.draft?'AI draft · edit before sending':'No draft · write a reply or leave it to the coach'}</span></div></div>`}}
  const missed=rows.filter(r=>has(r,'missed')&&r.x.inDiscord&&r.x.channel);
  h+=`<h2>Missed yesterday — needs a message (${missed.length})</h2>`+bulk('missed',missed,'missed');
  const scale=rows.filter(r=>has(r,'scale')&&r.x.inDiscord&&r.x.channel);
  h+=`<h2>Under target CPM — offer 5 posts a day (${scale.length})</h2>`+bulk('scale',scale,'scale');
  const aud={all:rows.filter(r=>r.x.inDiscord&&r.x.channel),today:rows.filter(r=>r.x.inDiscord&&r.x.channel&&r.x.postsToday===0)};
  h+=`<h2>Mass message</h2><div class="card"><div class="bar"><label>To <select id="mm_aud"><option value="all">All CapCut creators in Discord (${aud.all.length})</option><option value="today">No post yet today (${aud.today.length})</option></select></label>
  <label>Template <select id="mm_tpl">${Object.entries(TEMPLATES).map(([k,t])=>`<option value="${k}">${esc(t.label)}</option>`).join('')}</select></label></div>
  <textarea id="mm_text">${esc(TEMPLATES.checkin.text)}</textarea><div class="bar"><button class="pri" id="mm_send">Send to each creator's channel</button><span class="mute" style="font-size:12px">{first} becomes each creator's first name</span></div></div>`;
  const q=queue();
  h+=`<h2>Send queue (${q.length})</h2>`+(q.length?`<div class="tw"><table><tr><th>When</th><th>Action</th><th>To</th><th>Message</th><th>Status</th><th></th></tr>${q.slice(0,40).map(a=>`<tr><td class="mute">${ago(a.createdAt)}</td><td>${a.type==='rescan'?'Rescan':'Discord message'}</td><td>${esc(a.channel||a.scope||'')}</td><td class="wrap">${esc(a.text||'')}</td><td><span class="tag ${a.status==='done'?'grn':a.status==='failed'?'red':'amb'}">${esc(a.status)}</span></td><td>${a.status==='pending'?`<button class="sm" data-cancel="${esc(a.id)}">Cancel</button>`:''}</td></tr>`).join('')}</table></div>`:'<p class="mute">Nothing queued.</p>');
  return h;
}
// Oversight campaigns: who is waiting and for how long. Read-only (no replies or templates; sending is CapCut-only).
function vInbox(id){
  const c=camp(id); if(!c)return '<p class="mute">No '+esc(id)+' data yet.</p>';
  const un=c.unanswered.slice().sort((a,b)=>b.waitingMin-a.waitingMin), old=un.reduce((m,u)=>Math.max(m,u.waitingMin),0);
  const over5=un.filter(u=>u.waitingMin>=300).length, coaches=[...new Set(un.map(u=>u.coach||'Unassigned'))].sort((a,b)=>un.filter(u=>(u.coach||'Unassigned')===b).length-un.filter(u=>(u.coach||'Unassigned')===a).length);
  const k=(v,l,cls='')=>`<div class="kpi"><div class="v num ${cls}">${v}</div><div class="l">${l}</div></div>`;
  let h=`<div class="bar"><span class="mute">Oversight only: replies go through the coach. Discord scanned ${ago(c.discordScannedAt)}.</span><span style="flex:1"></span><button class="sm" data-rescan="${esc(c.id)}">↻ Recheck ${esc(c.name)}</button></div>`;
  if(!c.discordScannedAt&&!S.sample)return h+'<p class="mute">Discord has not been scanned for this campaign yet.</p>';
  h+='<div class="grid">'+k(un.length,'Creators waiting on a reply',un.length?'amb':'')+k(old?wait(old):'—','Longest wait',waitCls(old))+k(over5,'Waiting over 5h (strike line)',over5?'red':'')+'</div>';
  if(!un.length)return h+'<p class="mute">Everyone has been answered.</p>';
  for(const coach of coaches){
    const list=un.filter(u=>(u.coach||'Unassigned')===coach);
    h+=`<h2>${esc(coach)} (${list.length})</h2>`;
    for(const u of list)h+=`<div class="msg"><div class="top"><b>${esc(u.creator)}</b><span class="tag">${esc(u.channel)}</span><span class="num ${waitCls(u.waitingMin)}">no response for ${wait(u.waitingMin)}</span><span style="flex:1"></span>${openLink(msgUrl(c,u),!!u.messageId)}${u.channelId?`<button class="sm" data-recheck="${esc(u.channelId)}" data-camp="${esc(c.id)}">Recheck channel</button>`:''}</div>
    ${u.context?`<div class="mute" style="font-size:12px">Last from coach: ${esc(u.context)}</div>`:''}<div class="q">${esc(u.message)}</div></div>`;
  }
  return h;
}
function bulk(id,rows,tpl){
  if(!rows.length)return '<p class="mute">Nobody right now.</p>';
  return `<div class="tw"><table><tr><th><input type="checkbox" data-all="${id}" checked></th><th>Creator</th><th>Coach</th><th class="n">CPM</th><th class="n">Today</th><th class="n">Yesterday</th><th class="n">7d</th></tr>${rows.map(({x})=>`<tr><td><input type="checkbox" class="pick_${id}" value="${esc(x.id)}" checked></td><td><b>${esc(x.name)}</b> <span class="mute">${esc(x.channel)}</span></td><td>${esc(x.coach)}</td><td class="n">${money(x.cpm)}</td><td class="n">${x.postsToday}</td><td class="n">${x.postsYesterday}</td><td class="n">${x.posts7d}</td></tr>`).join('')}</table></div>
  <div class="bar"><input id="bt_${id}" style="flex:1;min-width:240px" value="${esc(TEMPLATES[tpl].text)}"><button class="pri" data-bulk="${id}">Message selected</button></div>`;
}

function vCoaches(){
  let h='<p class="mute">Median response = time from a creator message to the next staff reply in their channel, last 7 days. Red = over the 5h strike line.</p>';
  for(const c of S.campaigns){
    h+=`<h2>${esc(c.name)} ${c.role==='cm'?'· you CM':''}</h2><div class="tw"><table><tr><th>Coach</th><th class="n">Creators</th><th class="n">Median response</th><th class="n">Unanswered</th><th class="n">Oldest waiting</th><th class="n">Missed check-ins (7d)</th><th class="n">Strikes</th></tr>
    ${c.coaches.map(k=>`<tr><td><b>${esc(k.name)}</b></td><td class="n">${k.creators}</td><td class="n ${k.medianResponseMin==null?'mute':k.medianResponseMin>300?'red':k.medianResponseMin>120?'amb':'grn'}">${k.medianResponseMin==null?'—':wait(k.medianResponseMin)}</td><td class="n ${k.unanswered?'amb':''}">${k.unanswered}</td><td class="n ${waitCls(k.oldestUnansweredMin)}">${k.oldestUnansweredMin?wait(k.oldestUnansweredMin):'—'}</td><td class="n ${k.missedCheckins7d>=7?'red':''}">${k.missedCheckins7d??'—'}</td><td class="n ${k.strikes>=2?'red':k.strikes?'amb':''}">${k.strikes??'—'}</td></tr>`).join('')}</table></div>`;
    if(c.unanswered.length)h+=`<div class="tw" style="margin-top:8px"><table><tr><th>Creator left unanswered</th><th>Channel</th><th>Coach</th><th class="n">Waiting</th><th>Last message</th><th></th><th></th></tr>${c.unanswered.slice().sort((a,b)=>b.waitingMin-a.waitingMin).map(u=>`<tr><td><b>${esc(u.creator)}</b></td><td class="mute">${esc(u.channel)}</td><td>${esc(u.coach)}</td><td class="n ${waitCls(u.waitingMin)}">${wait(u.waitingMin)}</td><td class="wrap">${esc(u.message)}</td><td>${openLink(msgUrl(c,u),!!u.messageId)}</td><td>${u.channelId?`<button class="sm" data-recheck="${esc(u.channelId)}" data-camp="${esc(c.id)}">Recheck</button>`:''}</td></tr>`).join('')}</table></div>`;
  }
  return h;
}

function vCreators(){
  const FL=[['all','All'],['missed','Missed yesterday'],['today','No post today'],['noposts','No posts yet'],['health','Red account health'],['nodiscord','Not in Discord'],['lowviews','Low-view accounts'],['cut','Cut candidates'],['scale','Offer 5/day']];
  let rows=all().filter(r=>F.camp==='all'||r.c.id===F.camp);
  const count=k=>k==='all'?rows.length:rows.filter(r=>has(r,k)).length;
  const shown=rows.filter(r=>F.flag==='all'||has(r,F.flag)).sort((a,b)=>b.f.length-a.f.length||(b.x.cpm||0)-(a.x.cpm||0));
  return `<div class="bar"><div class="chips">${[['all','All campaigns'],...S.campaigns.map(c=>[c.id,c.name])].map(([k,l])=>`<span class="tag chip ${F.camp===k?'on':''}" data-fc="${esc(k)}">${esc(l)}</span>`).join('')}</div></div>
  <div class="bar"><div class="chips">${FL.map(([k,l])=>`<span class="tag chip ${F.flag===k?'on':''}" data-ff="${k}">${l} · ${count(k)}</span>`).join('')}</div></div>
  <div class="tw"><table><tr><th>Creator</th><th>Campaign</th><th>Coach</th><th class="n">CPM 7d</th><th class="n">CPM all-time</th><th class="n">Target</th><th class="n">Today</th><th class="n">Yest.</th><th class="n">7d posts</th><th class="n">Replies</th><th>Accounts</th><th>Flags</th></tr>
  ${shown.map(({c,x,f})=>`<tr><td><b>${esc(x.name)}</b> <span class="mute">${esc(x.handle)}</span></td><td>${esc(c.name)}</td><td>${esc(x.coach)}</td><td class="n ${x.cpm==null?'':x.cpm>c.targetCpm?'red':'grn'}">${money(x.cpm)}</td><td class="n ${x.cpmAllTime==null?'':x.cpmAllTime>c.targetCpm?'red':'grn'}">${money(x.cpmAllTime)}</td><td class="n mute">${money(c.targetCpm)}</td><td class="n">${x.postsToday}/${x.expectedPerDay}</td><td class="n ${x.postsYesterday?'':'red'}">${x.postsYesterday}</td><td class="n">${x.posts7d}</td><td class="n">${x.responseRate==null?"—":x.responseRate+"%"}</td><td>${(x.accounts||[]).map(a=>`<span class="tag num ${a.avgViews!=null?(a.avgViews<T.lowViews?'red':''):({red:'red',amber:'amb',green:'grn'}[a.health]||'')}" title="${esc(a.handle)}${a.health?' · health '+a.health:''}">${esc(a.platform.slice(0,2))}${a.avgViews!=null?' '+(a.avgViews>=1000?(a.avgViews/1000).toFixed(1)+'k':a.avgViews):''}</span>`).join(' ')}</td><td class="wrap">${f.map(g=>`<span class="tag ${g.c}">${esc(g.t)}</span>`).join(' ')}</td></tr>`).join('')||'<tr><td colspan="12" class="mute">Nobody matches.</td></tr>'}</table></div>
  <h2>Cut rules</h2><div class="card"><div class="bar">
  <label>CPM above <input class="thr num" data-t="cutCpmMult" type="number" step="0.1" value="${T.cutCpmMult}" style="width:70px">× campaign target</label>
  <label>Reply rate below <input class="thr num" data-t="minResp" type="number" value="${T.minResp}" style="width:70px">%</label>
  <label>Post volume below <input class="thr num" data-t="minVolPct" type="number" value="${T.minVolPct}" style="width:70px">% of expected</label>
  <label>Flag accounts averaging under <input class="thr num" data-t="lowViews" type="number" value="${T.lowViews}" style="width:70px"> views</label></div>
  <div class="mute" style="font-size:12px">Any one of these flags a creator as a cut candidate. "Offer 5/day" = CPM under the campaign target and hit expected posts yesterday. Account view averages are checked once a day (last check ${ago(S.accountsCheckedAt)}).</div></div>`;
}

function vSlack(){
  const item=m=>`<div class="msg"><div class="top"><b>${esc(m.from)}</b><span class="tag">${esc(m.channel)}</span>${m.waitingMin!=null?`<span class="num ${waitCls(m.waitingMin)}">waiting ${wait(m.waitingMin)}</span>`:''}<span style="flex:1"></span>${dmUrl(m)?`<a class="dl" href="${esc(dmUrl(m))}" target="_blank" rel="noopener">Open in Discord ↗</a>`:''}</div><div class="q">${esc(m.text)}</div></div>`;
  const dms=(S.dms||[]).slice().sort((a,b)=>(b.waitingMin||0)-(a.waitingMin||0));
  return '<div class="bar"><button class="sm" data-rescan="dms">↻ Recheck DMs</button><button class="sm" data-rescan="slack">↻ Recheck Slack</button></div><h2>Discord DMs waiting on you ('+dms.length+')</h2>'+(dms.map(item).join('')||'<p class="mute">'+(S.dms?'No DMs waiting.':'Not scanned yet.')+'</p>')+'<h2>Slack ('+S.slack.length+')</h2>'+(S.slack.length?vSlackList():'<p class="mute">'+((S.scanStatus&&S.scanStatus.slack==='ok')||S.sample?'Nothing waiting on you in Slack.':'Not scanned yet.')+'</p>');
}
function vSlackList(){
  return S.slack.slice().sort((a,b)=>b.waitingMin-a.waitingMin).map(m=>`<div class="msg"><div class="top"><b>${esc(m.from)}</b><span class="tag">${esc(m.channel)}</span><span class="num ${waitCls(m.waitingMin)}">waiting ${wait(m.waitingMin)}</span><span style="flex:1"></span>${m.url?`<a href="${esc(m.url)}" style="color:var(--blu)">Open in Slack</a>`:''}</div><div class="q">${esc(m.text)}</div></div>`).join('');
}
function vAudits(){
  if(!S.audits.length)return '<p class="mute">No audits loaded yet.</p>';
  return `<div class="tw"><table><tr><th>Campaign</th><th>Coach</th><th>Week</th><th class="n">Score</th><th class="n">Strikes</th><th>Summary</th><th></th></tr>${S.audits.map(a=>`<tr><td>${esc((camp(a.campaign)||{}).name||a.campaign)}</td><td><b>${esc(a.coach)}</b></td><td class="mute">${esc(a.week)}</td><td class="n ${a.score<70?'red':a.score<85?'amb':'grn'}">${a.score}</td><td class="n ${a.strikes>=2?'red':a.strikes?'amb':''}">${a.strikes}</td><td class="wrap">${esc(a.summary)}</td><td>${a.notionUrl?`<a href="${esc(a.notionUrl)}" style="color:var(--blu)">Notion</a>`:''}</td></tr>`).join('')}</table></div>`;
}

// Recheck progress. The portal only knows when the run was fired and when each source's results land
// (scanStatus.lpAt / discordAt / finishedAt), so the bar moves on those milestones and estimates in between.
const PHASES={ // [key, label, minutes incl. run start-up for the first step, milestone in scanStatus]
  all:[['lp','LaunchPoint',3.5,'lpAt'],['discord','Discord',11,'discordAt'],['slack','Slack',1.5,'finishedAt']],
  campaign:[['lp','LaunchPoint',3.5,'lpAt'],['discord','Discord',3,'finishedAt']],
  channel:[['discord','Discord channel',2.5,'finishedAt']],
  dms:[['discord','Discord DMs',3,'finishedAt']],
  slack:[['slack','Slack',3,'finishedAt']]};
const scopeName=s=>!s||s==='all'?'Full scan':/^channel:/.test(s)?'Channel recheck':s==='dms'?'DMs recheck':s==='slack'?'Slack recheck':((camp(s)||{}).name||s)+' recheck';
function progressInfo(){
  if(!live)return null;
  const now=Date.now(), rs=(S.queue||[]).filter(a=>a.type==='rescan'), a=rs.reduce((m,x)=>!m||+new Date(x.createdAt)>+new Date(m.createdAt)?x:m,null);
  const running=rs.find(x=>x.status==='running'), cur=running||a; if(!cur)return null;
  const scope=cur.runScope||cur.scope||'all', name=scopeName(scope)+(cur.source==='schedule'?' (scheduled)':'');
  const kind=scope==='all'?'all':/^channel:/.test(scope)?'channel':['dms','slack'].includes(scope)?scope:'campaign';
  const ph=PHASES[kind], total=ph.reduce((s,p)=>s+p[2],0), age=runnerAge();
  const steps=ph.map(p=>({label:p[1],ok:false}));
  if(cur.status==='pending'){
    const waited=(now-new Date(cur.createdAt))/60000; if(waited>120)return null;
    const off=age==null||age>2;
    return {name,steps,state:off?'late':'run',pct:2,text:off?`Waiting for the Mac Mini · it has not checked in ${age==null?'yet':'for '+wait(Math.round(age))}. Is it awake, with the runner installed?`:'Queued · the Mac Mini picks it up within 30 seconds'};
  }
  if(cur.status==='done'||cur.status==='failed'||cur.status==='cancelled'){
    const fin=cur.finishedAt?+new Date(cur.finishedAt):0; if(!fin||now-fin>(cur.status==='done'?90000:15*60000))return null;
    if(cur.status==='done')return {name,steps:steps.map(s=>({...s,ok:true})),state:'done',pct:100,text:'Done · results updated'};
    return {name,steps,state:'late',pct:100,text:'Failed'+(cur.detail?': '+cur.detail:'')};
  }
  // running: move on each source's results landing after the run started, estimate in between
  const t0=+new Date(cur.startedAt||cur.createdAt), st=S.scanStatus||{}, mins=(now-t0)/60000, hit=k=>st[k]&&+new Date(st[k])>=t0-5000?+new Date(st[k]):0;
  let acc=0,prev=t0,cp=ph[ph.length-1];
  ph.forEach((p,i)=>{steps[i].ok=!!hit(p[3])});
  for(const p of ph){const h=hit(p[3]);if(h){acc+=p[2];prev=Math.max(prev,h);continue}cp=p;break}
  const frac=Math.min(.95,(now-prev)/60000/cp[2]), pct=Math.max(3,Math.round((acc+frac*cp[2])/total*100));
  steps.forEach((s,i)=>s.now=!s.ok&&ph[i]===cp);
  if(mins>total*2+5)return {name,steps,state:'late',pct,text:`Still running after ${Math.round(mins)} min · it may be stuck (logged out somewhere?). It is freed automatically after 40 min.`};
  return {name,steps,state:'run',pct,text:(acc===0&&mins<1.5?'Starting on the Mac Mini':'Scanning '+cp[1])+` · about ${Math.max(1,Math.round(total-mins))} min left`};
}
function renderProgress(){
  const el=$('#progress'), p=progressInfo(); if(!el)return;
  if(!p){if(el.innerHTML)el.innerHTML='';return}
  const steps=p.steps.length>1?p.steps.map(s=>`<span class="${s.ok?'ok':s.now?'now':''}">${s.ok?'✓ ':''}${esc(s.label)}</span>`).join(''):'';
  const link='';
  let box=el.querySelector('.prog');
  if(!box){ // build once, then update pieces so the bar animates smoothly
    el.innerHTML=`<div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="100"><div class="top"><b class="pn"></b><span class="mute pt"></span><span style="flex:1"></span><span class="pl"></span><span class="num pp"></span></div><div class="track"><div class="fill" style="width:0"></div></div><div class="steps"></div></div>`;
    box=el.querySelector('.prog');
  }
  box.className='prog '+p.state; box.setAttribute('aria-valuenow',p.pct);
  box.querySelector('.pn').textContent=p.name; box.querySelector('.pt').textContent=p.text; box.querySelector('.pp').textContent=p.pct+'%';
  const pl=box.querySelector('.pl'); if(pl.innerHTML!==link)pl.innerHTML=link;
  const st=box.querySelector('.steps'); if(st.innerHTML!==steps)st.innerHTML=steps; st.style.display=steps?'':'none';
  box.querySelector('.fill').style.width=p.pct+'%';
}
const typing=()=>['TEXTAREA','INPUT','SELECT'].includes(document.activeElement.tagName);
let tick=0;
setInterval(()=>{renderProgress();const p=progressInfo();if(p&&p.state!=='done'&&live&&++tick%5===0&&!typing())load()},1000);

const cx=id=>camp('capcut').creators.find(x=>x.id===id);
async function sendTo(ids,text){
  const list=ids.map(cx).filter(x=>x&&x.inDiscord).map(x=>({type:'discord_send',campaign:'capcut',creator:x.name,channel:x.channel,channelId:x.channelId||null,text:fill(text,x.name)}));
  if(!list.length||!text.trim())return toast('Nothing to send');
  if(await act(list)){toast(`Queued ${list.length} message${list.length>1?'s':''}`+(live?'':' (preview: not sent)'));render()}
}
document.addEventListener('click',async e=>{
  const t=e.target, d=t.dataset||{};
  if(t.id==='refresh'){if(await act([{type:'rescan',scope:'all'}]))toast(fireMsg());render()}
  else if(d.rescan){if(await act([{type:'rescan',scope:d.rescan}]))toast(fireMsg());render()}
  else if(d.recheck){if(await act([{type:'rescan',scope:'channel:'+(d.camp||'capcut')+':'+d.recheck}]))toast(fireMsg());render()}
  else if(d.reply){const u=camp('capcut').unanswered.find(x=>x.id===d.reply), text=$('#d_'+CSS.escape(d.reply)).value;
    if(!text.trim())return toast('Write a reply first');
    if(await act([{type:'discord_send',campaign:'capcut',creator:u.creator,channel:u.channel,channelId:u.channelId||null,text}])){sentIds.add(u.id);toast('Reply queued'+(live?'':' (preview: not sent)'));render()}}
  else if(d.bulk){sendTo([...document.querySelectorAll('.pick_'+d.bulk+':checked')].map(i=>i.value),$('#bt_'+d.bulk).value)}
  else if(t.id==='mm_send'){const c=camp('capcut'),a=$('#mm_aud').value;sendTo(c.creators.filter(x=>x.inDiscord&&x.channel&&(a==='all'||x.postsToday===0)).map(x=>x.id),$('#mm_text').value)}
  else if(d.cancel){if(live){await fetch('api/actions/'+d.cancel,{method:'DELETE'});await load()}}
  else if(d.fc){F.camp=d.fc;render()}
  else if(d.ff){F.flag=d.ff;render()}
});
document.addEventListener('change',e=>{
  const t=e.target,d=t.dataset||{};
  if(t.id==='mm_tpl')$('#mm_text').value=TEMPLATES[t.value].text;
  else if(d.all)document.querySelectorAll('.pick_'+d.all).forEach(i=>i.checked=t.checked);
  else if(d.t){T[d.t]=Number(t.value)||0;try{localStorage.setItem('gk_thresholds',JSON.stringify(T))}catch(e){}render()}
});
addEventListener('hashchange',render);
load();
// Live site only: pull fresh state every 30s unless you're mid-typing.
setInterval(()=>{if(live&&!['TEXTAREA','INPUT','SELECT'].includes(document.activeElement.tagName))load()},30000);
</script>
