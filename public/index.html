<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GigaCM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0b0d;--side:#0d0e11;--s1:#121317;--s2:#17181d;--s3:#1d1f25;--line:rgba(255,255,255,.065);--line2:rgba(255,255,255,.11);
  --text:#ededef;--t2:#9a9ca5;--t3:#62646d;--acc:#8b93ff;--acc2:#6f78f5;--accbg:rgba(139,147,255,.12);
  --grn:#46c48a;--grnbg:rgba(70,196,138,.12);--amb:#e7a33e;--ambbg:rgba(231,163,62,.12);--red:#f06464;--redbg:rgba(240,100,100,.12);--blu:#5fa8f5;--blubg:rgba(95,168,245,.12);
  --r:10px;--shadow:0 1px 0 rgba(255,255,255,.03) inset,0 8px 24px rgba(0,0,0,.35);
}
@media (prefers-color-scheme:light){:root{
  --bg:#fbfbfc;--side:#f4f4f6;--s1:#ffffff;--s2:#f6f6f8;--s3:#eeeef1;--line:rgba(10,12,20,.08);--line2:rgba(10,12,20,.14);
  --text:#16171b;--t2:#5e616b;--t3:#9a9ca5;--acc:#5b63e6;--acc2:#4a52d4;--accbg:rgba(91,99,230,.09);
  --grn:#1f9d63;--grnbg:rgba(31,157,99,.1);--amb:#b7770f;--ambbg:rgba(183,119,15,.1);--red:#d64545;--redbg:rgba(214,69,69,.09);--blu:#2f7fd6;--blubg:rgba(47,127,214,.09);
  --shadow:0 1px 2px rgba(10,12,20,.04),0 8px 24px rgba(10,12,20,.08);}}
*{box-sizing:border-box}
html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{margin:0;background:var(--bg);color:var(--text);font:13.5px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;font-feature-settings:"cv11","ss01","ss03";display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.num,td.n,th.n{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-size:12px}
a{color:inherit}
::selection{background:var(--accbg)}

/* sidebar */
nav{background:var(--side);border-right:1px solid var(--line);padding:14px 10px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:1px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:9px;padding:4px 10px 16px;font-weight:600;font-size:14px;letter-spacing:-.01em}
.logo{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,var(--acc),#c084fc);display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700;box-shadow:0 2px 8px rgba(139,147,255,.35)}
.navsec{font-size:11px;font-weight:500;color:var(--t3);padding:14px 10px 5px;letter-spacing:.02em}
nav a{color:var(--t2);text-decoration:none;padding:6px 10px;border-radius:7px;display:flex;align-items:center;gap:9px;font-weight:500;transition:background .12s,color .12s}
nav a svg{width:15px;height:15px;opacity:.75;flex:none}
nav a:hover{color:var(--text);background:var(--s2)}
nav a.on{color:var(--text);background:var(--s3)}nav a.on svg{opacity:1}
nav a .cnt{margin-left:auto;font-size:11px;font-weight:600;color:var(--t2);background:var(--s3);border-radius:20px;padding:0 7px;line-height:18px;font-variant-numeric:tabular-nums}
nav a .cnt.hot{color:#fff;background:var(--red)}
.foot{margin-top:auto;padding:12px 10px 4px;font-size:12px;color:var(--t3);display:flex;flex-direction:column;gap:4px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px}
.dot.on{background:var(--grn);box-shadow:0 0 0 3px var(--grnbg)}.dot.off{background:var(--amb);box-shadow:0 0 0 3px var(--ambbg)}.dot.bad{background:var(--red);box-shadow:0 0 0 3px var(--redbg)}.dot.busy{background:var(--blu);box-shadow:0 0 0 3px var(--blubg);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.stl.busy{color:var(--blu)}
.stl{display:flex;gap:0;align-items:flex-start;line-height:1.45}.stl .dot{margin-top:5px;flex:none}.stl a{color:inherit;text-decoration:none}.stl a:hover{text-decoration:underline}
nav .stl a{padding:0;border-radius:0;font-weight:inherit;color:inherit}nav .stl a:hover{background:none}
.stl.warn{color:var(--amb)}.stl.err{color:var(--red)}.stl small{display:block;color:var(--t3);font-size:11.5px}
.mstatus{display:none;flex-direction:column;gap:6px;background:var(--redbg);border-radius:var(--r);padding:9px 14px;margin-bottom:14px;font-size:13px}
.mstatus.warn{background:var(--ambbg)}.mstatus.info{background:var(--blubg)}

/* main */
main{min-width:0;padding:0 0 80px}
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line);padding:14px 32px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
h1{font-size:17px;font-weight:600;letter-spacing:-.015em;margin:0}
.scanline{display:flex;gap:6px;flex-wrap:wrap;align-items:center;flex:1;min-width:0}
.pillinfo{font-size:12px;color:var(--t2);background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:2px 10px;white-space:nowrap}
.pillinfo b{color:var(--text);font-weight:500}
.wrap{padding:22px 32px;max-width:1380px}
h2{font-size:13px;font-weight:600;margin:30px 0 10px;letter-spacing:-.005em;display:flex;align-items:center;gap:8px}
h2 .sub{font-weight:400;color:var(--t3)}
.lede{color:var(--t2);margin:0 0 16px;max-width:760px}
.sample{background:var(--ambbg);color:var(--amb);padding:9px 14px;border-radius:var(--r);margin-bottom:16px;font-size:13px}

/* controls */
button,select,input,textarea{font:inherit;color:var(--text)}
button{cursor:pointer;background:var(--s2);border:1px solid var(--line2);border-radius:8px;padding:6px 12px;font-weight:500;transition:background .12s,border-color .12s,transform .05s;white-space:nowrap}
button:hover{background:var(--s3)}button:active{transform:translateY(.5px)}
button.pri{background:var(--acc2);border-color:transparent;color:#fff;box-shadow:0 1px 0 rgba(255,255,255,.15) inset,0 2px 8px rgba(111,120,245,.3)}button.pri:hover{background:var(--acc)}
button.ghost{background:transparent;border-color:transparent;color:var(--t2)}button.ghost:hover{background:var(--s2);color:var(--text)}
button.sm{padding:3px 9px;font-size:12px;border-radius:7px}
button:disabled{opacity:.4;cursor:default}
select,input[type=text],input[type=number],input:not([type]),textarea{background:var(--s1);border:1px solid var(--line2);border-radius:8px;padding:6px 10px;outline:none;transition:border-color .12s,box-shadow .12s}
select:focus,input:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--accbg)}
textarea{width:100%;min-height:72px;resize:vertical;line-height:1.5}
input[type=checkbox]{accent-color:var(--acc2);width:15px;height:15px;vertical-align:-3px;cursor:pointer}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}
.sp{flex:1}
.hint{color:var(--t3);font-size:12px}

/* tabs + chips */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:0 0 20px;overflow-x:auto;scrollbar-width:none}
.tabs a{padding:9px 12px 10px;color:var(--t2);text-decoration:none;border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:500;white-space:nowrap;display:flex;align-items:center;gap:7px;transition:color .12s}
.tabs a:hover{color:var(--text)}.tabs a.on{color:var(--text);border-color:var(--acc)}
.tabs .cnt{font-size:11px;color:var(--t2);background:var(--s3);border-radius:20px;padding:0 6px;line-height:17px}.tabs .cnt.hot{background:var(--redbg);color:var(--red)}
.seg{display:inline-flex;background:var(--s1);border:1px solid var(--line);border-radius:9px;padding:2px;gap:2px;flex-wrap:wrap}
.seg span{padding:4px 10px;border-radius:7px;color:var(--t2);cursor:pointer;font-weight:500;font-size:12.5px;user-select:none;white-space:nowrap}
.seg span:hover{color:var(--text)}.seg span.on{background:var(--s3);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.2)}
.seg span i{font-style:normal;color:var(--t3);margin-left:5px;font-variant-numeric:tabular-nums}.seg span i.red{color:var(--red);font-weight:600}
.custd{display:inline-flex;gap:6px;align-items:center;color:var(--t2);font-size:12.5px}.custd input{padding:4px 8px;color-scheme:light dark}

/* surfaces */
.card{background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.kpis{display:flex;flex-wrap:wrap;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:6px}
.kpi{background:var(--s1);padding:14px 16px;flex:1 1 150px}
.kpi .v{font-size:24px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi .l{color:var(--t2);font-size:12px;margin-top:2px}
.kpi .v.red{color:var(--red)}.kpi .v.amb{color:var(--amb)}.kpi .v.grn{color:var(--grn)}.kpi .v.blu{color:var(--blu)}
.row{display:flex;justify-content:space-between;gap:12px;padding:5px 0;color:var(--t2);border-bottom:1px solid var(--line)}.row:last-of-type{border-bottom:0}.row b{color:var(--text);font-weight:500}
.card h3{margin:0 0 10px;font-size:14px;font-weight:600;display:flex;gap:8px;align-items:center;letter-spacing:-.01em}
.red{color:var(--red)}.amb{color:var(--amb)}.grn{color:var(--grn)}.blu{color:var(--blu)}.mute{color:var(--t2)}.faint{color:var(--t3)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:1px 8px;border-radius:20px;background:var(--s3);color:var(--t2);font-weight:500;white-space:nowrap;line-height:19px}
.tag.red{background:var(--redbg);color:var(--red)}.tag.amb{background:var(--ambbg);color:var(--amb)}.tag.grn{background:var(--grnbg);color:var(--grn)}.tag.blu{background:var(--blubg);color:var(--blu)}.tag.acc{background:var(--accbg);color:var(--acc)}
.spark{display:flex;align-items:flex-end;gap:3px;height:36px;margin-top:12px}.spark i{flex:1;background:var(--acc);opacity:.85;border-radius:2px 2px 0 0;min-height:2px}.spark i.z{background:var(--s3)}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--s1)}
table{border-collapse:collapse;width:100%}
th,td{padding:9px 14px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--t3);font-size:11.5px;font-weight:500;position:sticky;top:0;background:var(--s1)}
tbody tr{transition:background .1s}tbody tr:hover{background:var(--s2)}tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right}td.c,th.c{text-align:center}
td.wrapc{white-space:normal;min-width:240px;color:var(--t2)}
th.sortable{cursor:pointer}th.sortable:hover{color:var(--text)}

/* checks */
.ck{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;font-size:11px;font-weight:700}
.ck.ok{background:var(--grnbg);color:var(--grn)}.ck.bad{background:var(--redbg);color:var(--red)}.ck.warn{background:var(--ambbg);color:var(--amb)}.ck.na{background:var(--s3);color:var(--t3)}
.checklist{display:flex;flex-direction:column}
.ci{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:start;padding:11px 0;border-bottom:1px solid var(--line)}.ci:last-child{border-bottom:0}
.ci .lbl{font-weight:500}.ci .det{color:var(--t2);font-size:12.5px;margin-top:1px}
.ci ul{margin:6px 0 0;padding-left:16px;color:var(--t2);font-size:12.5px;columns:2;column-gap:28px}.ci li{margin:1px 0;break-inside:avoid}

/* message list */
.list{background:var(--s1);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.item{padding:14px 18px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:32px 1fr;gap:12px;transition:background .1s}
.item:last-child{border-bottom:0}.item:hover{background:var(--s2)}
.item.done{opacity:.45}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;color:#fff}
.ihead{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ihead b{font-weight:600}
.meta{color:var(--t3);font-size:12px}
.quote{margin:7px 0 2px;color:var(--text);white-space:pre-wrap;word-break:break-word}
.ctx{color:var(--t3);font-size:12px;margin-top:6px}
.actions{display:flex;gap:6px;align-items:center;margin-top:10px;flex-wrap:wrap}
.preview{background:var(--s2);border:1px solid var(--line);border-radius:8px;padding:9px 12px;color:var(--text);white-space:pre-wrap}
a.lk{color:var(--acc);text-decoration:none;font-size:12px;font-weight:500;white-space:nowrap}a.lk:hover{text-decoration:underline}
.readsec{margin-top:14px}.readsec .item{opacity:.6}
.empty{padding:28px;text-align:center;color:var(--t3);background:var(--s1);border:1px dashed var(--line2);border-radius:12px}

/* job progress panel */
#jobpanel{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:16px}
#jobpanel.on{display:flex}
#jobpanel .box{background:var(--s1);border:1px solid var(--line2);border-radius:14px;box-shadow:var(--shadow);width:440px;max-width:100%;padding:18px 20px}#jobpanel .box.anim{animation:pop .14s ease-out}
#jobpanel h3{margin:0 0 2px;font-size:15px;display:flex;align-items:center;gap:8px}
.jsteps{display:flex;flex-direction:column;margin:14px 0 4px}
.jstep{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:start;padding:7px 0;position:relative}
.jstep .ck{width:20px;height:20px;font-size:10px}.jstep .lbl{font-weight:500}.jstep .lbl small{display:block;font-weight:400;color:var(--t3);font-size:12px}
.jstep .tm{color:var(--t3);font-size:12px;white-space:nowrap}
.ck.now{background:var(--blubg);color:var(--blu);animation:pulse 1.6s ease-in-out infinite}
.jnote{border-radius:9px;padding:9px 12px;font-size:12.5px;margin-top:10px}.jnote.warn{background:var(--ambbg);color:var(--amb)}.jnote.bad{background:var(--redbg);color:var(--red)}.jnote.info{background:var(--s2);color:var(--t2)}

/* check details on hover */
#tipbox{position:fixed;z-index:60;max-width:340px;background:var(--s1);border:1px solid var(--line2);border-radius:12px;box-shadow:var(--shadow);padding:12px 14px;font-size:12.5px;line-height:1.5;color:var(--t2);display:none;pointer-events:none}
#tipbox.on{display:block;animation:pop .12s ease-out}
#tipbox h4{margin:0 0 4px;font-size:13px;color:var(--text);display:flex;gap:8px;align-items:center}
#tipbox .rl{display:grid;grid-template-columns:20px 1fr;gap:3px 8px;align-items:start;margin:8px 0 2px}
#tipbox .rl .ck{width:18px;height:18px;font-size:10px}
#tipbox .now{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);color:var(--text)}
[data-tipk]{cursor:help}td[data-tipk]:hover,td[data-tipk]:focus{background:var(--s2);outline:none}
.sumgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}
.sumc h3 .verdict{font-size:11.5px;font-weight:600;padding:1px 9px;border-radius:20px}
.sumc .lines{display:flex;flex-direction:column;gap:6px;margin-top:10px;font-size:12.5px}
.sumc .lines div{display:grid;grid-template-columns:20px 1fr;gap:8px;align-items:start}
.sumc .lines .ck{width:18px;height:18px;font-size:10px}
.sumc .ai{margin-top:10px;padding:9px 11px;border-radius:9px;background:var(--accbg);color:var(--text);font-size:12.5px}

/* coach ranking */
.rank{border-bottom:1px solid var(--line)}.rank:last-child{border-bottom:0}
.rhead{display:grid;grid-template-columns:30px minmax(0,1fr) auto 18px;gap:12px;align-items:center;padding:12px 16px;cursor:pointer;user-select:none}
.rhead:hover{background:var(--s2)}
.rk{width:26px;height:26px;border-radius:50%;background:var(--s3);color:var(--t2);display:grid;place-items:center;font-weight:600;font-size:12px;font-variant-numeric:tabular-nums}
.rk.lead{background:var(--accbg);color:var(--acc)}
.rname{font-weight:600;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}.rname span{font-weight:400;color:var(--t3);font-size:12px}
.rbar{display:flex;align-items:center;gap:8px;margin-top:5px}.rbar .tr{flex:1;max-width:240px;height:6px;border-radius:4px;background:var(--s3);overflow:hidden}.rbar .tr i{display:block;height:100%;border-radius:4px}
.rbar b{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;min-width:34px}.rbar .faint{font-size:12px}
.pips{display:flex;gap:3px;align-items:center}.pips i{width:9px;height:9px;border-radius:50%;background:var(--s3)}.pips i.on{background:var(--red)}
.pipl{font-size:11px;color:var(--t3);text-align:right;margin-top:3px;white-space:nowrap}
.chev{color:var(--t3);transition:transform .15s;text-align:center}.rank.open .chev{transform:rotate(90deg)}
.rbody{padding:0 16px 14px 58px}
@media(max-width:860px){.rbody{padding-left:16px}}

/* rescan menu */
.menuwrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 8px);width:420px;max-width:calc(100vw - 32px);background:var(--s1);border:1px solid var(--line2);border-radius:14px;box-shadow:var(--shadow);padding:6px;z-index:20;display:none}
.menu.on{display:block;animation:pop .14s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.mi{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:9px;cursor:pointer}
.mi:hover{background:var(--s2)}.mi .ttl{font-weight:600}.mi .d{color:var(--t2);font-size:12px}
.mi .ic{width:30px;height:30px;border-radius:8px;background:var(--accbg);color:var(--acc);display:grid;place-items:center;flex:none;font-size:14px}
.mi.small{padding:7px 12px}.mi.small .ttl{font-weight:500;font-size:13px}.mi.small .ic{width:24px;height:24px;font-size:12px;border-radius:7px;background:var(--s3);color:var(--t2)}
.msec{border-top:1px solid var(--line);margin:6px 0 0;padding:10px 12px 6px}
.msec .h{font-size:11.5px;color:var(--t3);font-weight:500;margin-bottom:6px;display:flex}
.cbgrid{display:grid;grid-template-columns:1fr 90px 90px;gap:2px 8px;align-items:center}
.cbgrid label{display:flex;align-items:center;gap:7px;padding:4px 0;cursor:pointer}
.cbgrid .hd{font-size:11.5px;color:var(--t3);text-align:center}
.cbgrid .cc{text-align:center}
.hist{display:flex;flex-direction:column;gap:2px;max-height:220px;overflow:auto}
.hist div{display:flex;gap:8px;align-items:center;padding:4px 0;font-size:12.5px}
.hist .w{color:var(--t3);margin-left:auto;white-space:nowrap}

/* progress */
.prog{background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:18px 32px 0}
.prog .top2{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}.prog .top2 b{font-weight:600}
.prog .track{height:4px;background:var(--s3);border-radius:4px;overflow:hidden;margin-top:10px}
.prog .fill{height:100%;background:linear-gradient(90deg,var(--acc2),var(--acc));border-radius:4px;transition:width .9s linear}
.prog.done .fill{background:var(--grn)}.prog.late .fill{background:var(--amb)}
.steps{display:flex;gap:16px;margin-top:8px;font-size:12px;color:var(--t3);flex-wrap:wrap}.steps .ok{color:var(--grn)}.steps .now{color:var(--text);font-weight:500}

#toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,8px);background:var(--text);color:var(--bg);padding:9px 16px;border-radius:10px;font-weight:500;opacity:0;transition:opacity .18s,transform .18s;pointer-events:none;max-width:90vw;box-shadow:var(--shadow);z-index:50}
#toast.on{opacity:1;transform:translate(-50%,0)}

@media(max-width:860px){
  body{grid-template-columns:1fr}
  nav{position:static;height:auto;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px;gap:2px}
  .brand,.foot,.navsec{display:none}nav a{white-space:nowrap}
  .mstatus{display:flex}
  .top,.wrap{padding-left:16px;padding-right:16px}.prog{margin:14px 16px 0}

<script>
/* ---------- constants ---------- */
const CAMPS=['capcut','artlist','creatify','melius','yri'];
const NAMES={capcut:'CapCut',artlist:'Artlist',creatify:'Creatify',melius:'Melius',yri:'YRI'};
const MINE=['capcut','yri']; // Ty coaches these: reply queue, drafts and Send
const ICON={
  today:'<path d="M3 9h18M7 3v4M17 3v4M5 5h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z"/>',
  camp:'<path d="M4 4h16v16H4z" opacity=".0"/><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/>',
  people:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6"/>',
  chat:'<path d="M4 5h16v11H8l-4 4z"/>',
  doc:'<path d="M6 3h9l5 5v13H6z"/><path d="M14 3v6h6"/>'};
const svg=k=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICON[k]}</svg>`;
const VIEWS=[['today','Today','today'],['capcut','CapCut','camp'],['artlist','Artlist','camp'],['creatify','Creatify','camp'],['melius','Melius','camp'],['yri','YRI','camp'],['coaches','Coaches server','chat'],['creators','Creators & flags','people'],['slack','Slack & DMs','chat'],['audits','Weekly audits','doc']];
// CapCut Discord channels used in the welcome message (<#id> renders as a channel link in Discord).
const CH={startHere:'1569757043642867835',tyAnn:'1570964214728630322'};
const CHNAME={[CH.startHere]:'🏁-start-here',[CH.tyAnn]:'team-ty-announcements'};
const TEMPLATES={
  welcome:{label:'Welcome',text:`Hey {first}, excited to have you! Check out <#${CH.startHere}> first, then head to <#${CH.tyAnn}> for onboarding. Lmk once your accounts are made`},
  checkin:{label:'Daily check-in',text:'Hey {first}, how many posts you getting out today?'},
  missed:{label:'Missed yesterday',text:"Hey {first}, I didn't see a post from you yesterday. Everything good? What's the plan to get back on track today?"},
  scale:{label:'Offer 5/day',text:'Hey {first}, your CPM is sitting under the campaign target, nice work. Want to bump from 3 posts a day to 5?'},
  custom:{label:'Custom…',text:''}
};
const GUILD={capcut:'1569756845319520387',artlist:'1570552478817067038',creatify:'1562201369811877949',melius:'1559661121588306052'};
const H=36e5, DAY=864e5;
const WIN=[['a','start',12],['b','mid',17],['c','end',22]]; // ET check-in windows and the hour each one closes

/* ---------- state ---------- */
let S={campaigns:[],slack:[],audits:[],queue:[]}, live=false, offline=false, localQueue=[], sentIds=new Set(), copied=new Set();
let T={cutCpmMult:1.5,minResp:50,minVolPct:50,lowViews:200};
let F={camp:'all',flag:'all'};
const WHO={capcut:'Ty McGuire',yri:'Ty McGuire'}; // coach filter per campaign page
let SORT='wait', SHOWREAD=false;
/* ---------- marked as read ---------- */
// A mark names the exact message: channel + time of its latest message + a hash of the text. If the creator sends
// anything new, the key changes and the item is back in the queue.
const hh=t=>{let h=2166136261;for(const ch of String(t||''))h=Math.imul(h^ch.charCodeAt(0),16777619)>>>0;return h.toString(36)};
const unKey=u=>'u:'+(u.channelId||u.id)+':'+(u.lastAt||'')+':'+hh(u.message);
const dmKey=m=>'dm:'+m.id+':'+(m.lastAt||'')+':'+hh(m.text);
const slKey=m=>'s:'+m.channel+':'+(m.lastAt||'')+':'+hh(m.text);
const coKey=m=>'co:'+m.channelId+':'+(m.lastAt||'')+':'+hh(m.text);
const isRead=k=>!!(S.read&&S.read[k]);
function applyRead(){
  S.campaigns.forEach(c=>{const a=c.allUn||c.unanswered;c.unanswered=a.filter(u=>!isRead(unKey(u)));c.readUn=a.filter(u=>isRead(unKey(u)));const t=c.allTag||c.tagged||[];c.tagged=t.filter(u=>!isRead(unKey(u)));c.readUn=c.readUn.concat(t.filter(u=>isRead(unKey(u))))});
  if(S.allDms){S.dms=S.allDms.filter(m=>!isRead(dmKey(m)));S.readDms=S.allDms.filter(m=>isRead(dmKey(m)))}else S.readDms=[];
  const sl=S.allSlack||[];S.slack=sl.filter(m=>!isRead(slKey(m)));S.readSlack=sl.filter(m=>isRead(slKey(m)));
  const co=(S.coaches&&S.coaches.items)||[];S.coachItems=co.filter(m=>!isRead(coKey(m)));S.readCoach=co.filter(m=>isRead(coKey(m)));
}
async function markRead(key,label,on,extra){
  S.read=S.read||{};
  if(on)S.read[key]={at:new Date().toISOString(),label,...(extra||{})};else delete S.read[key];
  applyRead();render();toast(on?'Marked read · hidden until they send something new':'Back in the queue');
  if(live)try{const r=await fetch('api/read',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key,label,read:on,...(extra||{})})});if(!r.ok)throw new Error((await r.json()).error);await load()}
  catch(e){toast('Could not save: '+e.message)}
}
// When the reply clock started for a waiting creator (older scans: worked out from the wait time).
const startOf=(c,u)=>u.startAt||new Date(+new Date(c.discordScannedAt||Date.now())-u.waitingMin*6e4).toISOString();
const readBtn=(key,label,c,u)=>`<button class="sm ghost" data-markread="${esc(key)}" data-label="${esc(label)}"${c&&u?` data-camp="${c.id}" data-uid="${esc(u.id)}"`:''}>✓ Mark read</button>`;
// Mark read counts as the reply: the response is timed from the creator's message to the click, unless a coach answered
// sooner. If they wrote again after the click, the scan's own timing stands. Then the 7-day stats are recomputed.
function adjustResp(){
  const marks=Object.values(S.read||{}).filter(m=>m.c&&m.ch&&m.start);
  S.campaigns.forEach(c=>{
    const chans=(c.discord||{}).channels||{}, stats=(c.discord=c.discord||{}).coachStats=(c.discord.coachStats||{}), touched=new Set();
    marks.filter(m=>m.c===c.id).forEach(m=>{
      const coach=(chans[m.ch]||{}).coach||m.coach; if(!coach)return;
      const cs=stats[coach]=stats[coach]||{medianResponseMin:null,replies7d:0,over15h7d:0}; cs.resp=cs.resp||[]; cs.marked=cs.marked||[];
      const T=Math.round(+new Date(m.start)/6e4), mins=Math.max(0,Math.round(+new Date(m.at)/6e4)-T), lastM=m.last?Math.round(+new Date(m.last)/6e4):null;
      const e=cs.resp.find(x=>x[2]===m.ch&&Math.abs(x[0]-T)<=2);
      if(e){if(e[3]==null||lastM==null||e[3]<=lastM+1){if(mins<e[1])cs.marked.push(T);e[1]=Math.min(e[1],mins)}}
      else{cs.resp.push([T,mins,m.ch,lastM??T]);cs.marked.push(T)}
      touched.add(coach);
    });
    touched.forEach(k=>{const cs=stats[k],wk=(Date.now()-7*DAY)/6e4,w=cs.resp.sort((a,b)=>a[0]-b[0]).filter(e=>e[0]>=wk).map(e=>e[1]);
      cs.medianResponseMin=med(w);cs.replies7d=w.length;cs.over15h7d=w.filter(x=>x>900).length});
  });
}
function readSection(items,keyFn,row){
  if(!items.length)return '';
  return `<div class="readsec"><button class="sm ghost" data-showread="1">${SHOWREAD?'Hide':'Show'} marked read (${items.length})</button>${SHOWREAD?`<div class="list" style="margin-top:8px">${items.map(m=>row(m,`<button class="sm ghost" data-unread="${esc(keyFn(m))}">Mark unread</button>`)).join('')}</div>`:''}</div>`;
}
try{Object.assign(T,JSON.parse(localStorage.getItem('gk_thresholds')||'{}'))}catch(e){}

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const wait=m=>m<60?Math.round(m)+'m':m<1440?Math.floor(m/60)+'h '+Math.round(m%60)+'m':Math.floor(m/1440)+'d '+Math.floor(m%1440/60)+'h';
const waitCls=m=>m>=900?'red':m>=300?'amb':'';
const money=n=>n==null||isNaN(n)?'—':'$'+Number(n).toFixed(2);
const fmtN=n=>n>=1e6?(n/1e6).toFixed(2)+'M':n>=1e3?(n/1e3).toFixed(1)+'k':String(n);
const ago=iso=>{if(!iso)return'never';const m=Math.max(0,Math.round((Date.now()-new Date(iso))/60000));return m<1?'just now':wait(m)+' ago'};
const camp=id=>S.campaigns.find(c=>c.id===id);
const snow=id=>/^\d{15,22}$/.test(String(id||''))?Number(BigInt(id)>>22n)+1420070400000:null; // Discord id -> creation time
const isTy=n=>/^Ty\b/.test(n||'');
const first=n=>String(n||'').split(' ')[0];
const plural=(n,w)=>n+' '+(n===1?w:/[^aeiou]y$/.test(w)?w.slice(0,-1)+'ies':/(ch|sh|s|x)$/.test(w)?w+'es':w+'s');
const AVC=['#7c83ff','#c084fc','#f472b6','#fb923c','#34d399','#38bdf8','#facc15','#a3e635'];
const av=n=>{let h=0;for(const ch of String(n||'?'))h=(h*31+ch.charCodeAt(0))>>>0;return `<div class="av" style="background:${AVC[h%AVC.length]}">${esc((String(n||'?').match(/\p{L}|\d/u)||['?'])[0].toUpperCase())}</div>`};
const msgUrl=(c,u)=>{const g=(c&&(c.guildId||GUILD[c.id]));if(!g||!/^\d+$/.test(String(u.channelId||'')))return null;return 'https://discord.com/channels/'+g+'/'+u.channelId+(/^\d+$/.test(String(u.messageId||''))?'/'+u.messageId:'')};
const chanUrl=(c,id)=>msgUrl(c,{channelId:id});
const dmUrl=m=>/^\d+$/.test(String(m.id||''))?'https://discord.com/channels/@me/'+m.id+(/^\d+$/.test(String(m.messageId||''))?'/'+m.messageId:''):null;
const openLink=(url,exact)=>url?`<a class="lk" href="${esc(url)}" target="_blank" rel="noopener">${exact?'Open message ↗':'Open channel ↗'}</a>`:'';
const mentions=t=>esc(t).replace(/&lt;#(\d+)&gt;/g,(m,id)=>`<span class="tag blu">#${esc(CHNAME[id]||id)}</span>`);
const fill=(t,name)=>t.replaceAll('{first}',first(name));
const chInfo=(c,x)=>x&&x.channelId&&c.discord&&c.discord.channels?c.discord.channels[x.channelId]||null:null;
const runnerAge=()=>S.runner&&S.runner.lastPollAt?(Date.now()-new Date(S.runner.lastPollAt))/60000:null;
const fireMsg=()=>!live?'Rescan queued (preview)':runnerAge()!=null&&runnerAge()<2?'Queued · the Mac Mini picks it up within 30 seconds':'Queued · the Mac Mini will run it once it checks in again';
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2600)}
const etParts=t=>Object.fromEntries(new Intl.DateTimeFormat('en-CA',{timeZone:'America/New_York',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',hourCycle:'h23'}).formatToParts(new Date(t)).map(x=>[x.type,x.value]));
const etDay=t=>{const p=etParts(t);return `${p.year}-${p.month}-${p.day}`};
async function copy(text){try{await navigator.clipboard.writeText(text);return true}catch(e){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();return ok}}

/* ---------- creator status: posting / warming up / waiting on first post / not started / idle ---------- */
function cstat(c,x){
  const ch=chInfo(c,x), now=Date.now(), days=x.daysOnCampaign||null, last=x.lastPostAt?+new Date(x.lastPostAt):null;
  const warmAt=ch&&ch.warmAt?+new Date(ch.warmAt):null, warmRecent=warmAt&&now-warmAt<7*DAY&&(!last||warmAt>last);
  if(x.postsToday>0||x.postsYesterday>0||(last&&now-last<48*H))return {k:'posting'};
  if(warmRecent)return {k:'warming',why:`said “${ch.warmText}” ${ago(ch.warmAt)}`};
  if(x.everPosted===false&&days!=null&&days<=2)return {k:'warming',why:`joined ${plural(days,'day')} ago · warm-up is about 2 days`};
  if(x.everPosted===false&&days!=null&&days<=5)return {k:'firstpost',why:`day ${days} · first post due by day 5`};
  if(x.everPosted===false)return {k:'notstarted',why:`day ${days||'?'} · past the 5-day deadline`};
  const idle=last?Math.floor((now-last)/DAY):null;
  return {k:'idle',days:idle,why:idle!=null?`no post for ${plural(idle,'day')}`:'no recent posts'};
}
const STAT={posting:['Posting','grn'],warming:['Warming up','blu'],firstpost:['Waiting on first post','blu'],notstarted:['No first post','red'],idle:['Not posting','amb']};
const joinedAt=x=>snow(x.channelId)||(x.daysOnCampaign?Date.now()-x.daysOnCampaign*DAY:null);

function flags(c,x){
  const f=[], s=cstat(c,x), active=s.k==='posting'||s.k==='idle';
  if(!x.inDiscord)f.push({k:'nodiscord',t:'Not in Discord',c:'blu'});
  if(s.k==='warming')f.push({k:'warming',t:'Warming up'+(x.daysOnCampaign>7?' · day '+x.daysOnCampaign:''),c:x.daysOnCampaign>7?'red':'blu'});
  if(s.k==='firstpost')f.push({k:'noposts',t:'First post due · day '+x.daysOnCampaign,c:'blu'});
  if(s.k==='notstarted')f.push({k:'noposts',t:'No first post · day '+(x.daysOnCampaign||'?'),c:'red'});
  if(active&&x.postsYesterday===0)f.push({k:'missed',t:'Missed yesterday',c:'red'});
  if(active&&x.postsToday===0)f.push({k:'today',t:'No post today',c:'amb'});
  if(s.k==='idle'&&s.days>=3)f.push({k:'idle3',t:s.days+' days no post · escalate',c:'red'});
  const redA=(x.accounts||[]).filter(a=>a.health==='red');
  if(redA.length)f.push({k:'health',t:'Account health red: '+redA.map(a=>a.platform).join(', '),c:'amb'});
  const low=(x.accounts||[]).filter(a=>a.avgViews!=null&&a.avgViews<T.lowViews);
  if(low.length)f.push({k:'lowviews',t:'Low views: '+low.map(a=>a.platform+' '+a.avgViews).join(', '),c:'amb'});
  const cut=[];
  if(s.k==='notstarted')cut.push('no first post in '+x.daysOnCampaign+' days');
  if(x.cpm!=null&&x.posts7d>=5&&x.cpm>c.targetCpm*T.cutCpmMult)cut.push('CPM '+money(x.cpm));
  if(x.responseRate!=null&&x.responseRate<T.minResp)cut.push('replies '+x.responseRate+'%');
  const exp=x.expectedPerDay*Math.min(7,x.daysOnCampaign||7);
  if(active&&x.posts7d<exp*T.minVolPct/100)cut.push('volume '+x.posts7d+'/'+exp);
  if(cut.length)f.push({k:'cut',t:'Cut? '+cut.join(', '),c:'red'});
  if(x.cpm!=null&&x.cpm<c.targetCpm&&x.postsYesterday>=x.expectedPerDay)f.push({k:'scale',t:'Offer 5/day',c:'grn'});
  return f;
}
const all=()=>S.campaigns.flatMap(c=>c.creators.map(x=>({c,x,f:flags(c,x)})));
const has=(r,k)=>r.f.some(f=>f.k===k);
const pendingUn=c=>{const m=c.unanswered.filter(u=>isTy(u.coach));return (m.length?m:c.unanswered).filter(u=>!sentIds.has(u.id))};
// @Ty tags in any coach's channels: waiting on Ty himself (left out when the same channel is already in his own queue).
const tagsOf=c=>{if(!c)return[];const own=new Set(MINE.includes(c.id)?pendingUn(c).map(u=>u.channelId):[]);return (c.tagged||[]).filter(u=>!own.has(u.channelId)&&!sentIds.has(u.id))};
const waitingOn=c=>c?(MINE.includes(c.id)?pendingUn(c).concat(tagsOf(c)):c.unanswered):[];

/* ---------- coach daily audit (UGC Coach SOP + strike rules) ---------- */
const TFS=[['today','Today so far'],['yday','Yesterday'],['7d','7 days'],['lw','Last week'],['30d','30 days'],['custom','Custom']];
const chiDate=t=>new Date(t).toLocaleDateString('en-CA',{timeZone:'America/Chicago'});
const addDay=(d,n)=>new Date(Date.parse(d+'T12:00:00Z')+n*DAY).toISOString().slice(0,10);
const dayStart=d=>chiMid(Date.parse(d+'T12:00:00Z')+6*H); // Chicago midnight starting date d (noon UTC is that day in Chicago)
// Custom range (Chicago dates, inclusive). LaunchPoint day-by-day data covers the last 30 days.
let CUST={from:addDay(chiDate(Date.now()),-13),to:addDay(chiDate(Date.now()),-1)};
const lastWeek=(now=Date.now())=>{const today=chiDate(now),end=addDay(today,-(((new Date(today+'T12:00:00Z').getUTCDay()+6)%7)+1));return {from:addDay(end,-6),to:end}};
const tfLow=tf=>{const l=tfLabel(tf);return tf==='custom'||String(tf).startsWith('r:')?l:l[0].toLowerCase()+l.slice(1)}; // lower-cases the first letter only, not month names
const fmtD=d=>new Date(d+'T12:00:00Z').toLocaleDateString('en-US',{month:'short',day:'numeric',timeZone:'UTC'});
const tfLabel=tf=>String(tf).startsWith('r:')?(()=>{const [,a,b]=tf.split(':');return `${fmtD(a)}–${fmtD(b)}`})():tf==='lw'?(()=>{const w=lastWeek();return `Last week (${fmtD(w.from)}–${fmtD(w.to)})`})():tf==='custom'?`${fmtD(CUST.from)}–${fmtD(CUST.to)}`:(TFS.find(t=>t[0]===tf)||[])[1];
// Posts per day for the last 30 days as [{date,n}], from LaunchPoint (null when the scan hasn't collected it yet).
const days30=(c,x)=>{const d=x.d30;if(!d)return null;const ds=c.days30&&c.days30.length===d.length?c.days30:d.map((_,i)=>addDay(chiDate(Date.now()),i-(d.length-1)));return d.map((n,i)=>({date:ds[i],n:n||0}))};
let TF='today';
const chiMid=t=>{const p=Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:'America/Chicago',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).formatToParts(new Date(t)).map(x=>[x.type,x.value]));return t-((+p.hour*60+ +p.minute)*60+ +p.second)*1000-new Date(t).getMilliseconds()};
function tfWin(tf,now=Date.now()){const m=chiMid(now);if(String(tf).startsWith('r:')){const [,a,b]=tf.split(':');return [dayStart(a),Math.min(now,dayStart(addDay(b,1)))]}if(tf==='lw'){const w=lastWeek(now);return [dayStart(w.from),dayStart(addDay(w.to,1))]}if(tf==='custom'){const a=CUST.from<=CUST.to?CUST:{from:CUST.to,to:CUST.from};return [dayStart(a.from),Math.min(now,dayStart(addDay(a.to,1)))]}return tf==='today'?[m,now]:tf==='yday'?[m-DAY,m]:tf==='7d'?[now-7*DAY,now]:[now-30*DAY,now]}
// What the response numbers leave out or time at the Mark read click, for one window.
const leftOut=(cs,t0,t1)=>{const inW=a=>(a||[]).filter(m=>m*6e4>=t0&&m*6e4<t1).length,a=inW(cs.acks),m=inW(cs.marked);
  return (a?` · ${plural(a,'acknowledgment')} (ok, thanks…) needed no reply`:'')+(m?` · ${m} timed at your Mark read click`:'')};
const med=a=>{a=a.slice().sort((x,y)=>x-y);return a.length?a[Math.floor(a.length/2)]:null};
const groupCpm=rows=>{let v=0,s=0;rows.forEach(([cpm,views])=>{if(cpm!=null&&views){v+=views;s+=cpm*views/1000}});return v?s/v*1000:null};
// When did the creator start posting, as an index into the 7-day strip (0 = 6 days ago, 6 = today)? -1 = before the strip.
const activeFrom=x=>{const d=x.daily||[];const sum=d.reduce((a,b)=>a+b,0);if(x.postsAllTime>sum)return 0;const i=d.findIndex(n=>n>0);return i<0?99:i};

/* ---------- coach audit for one timeframe (UGC Coach SOP + strike rules) ---------- */
function audit(c,name,tf=TF){
  const now=Date.now(), [t0,t1]=tfWin(tf,now), cr=c.creators.filter(x=>x.coach===name).map(x=>({x,s:cstat(c,x)}));
  const un=c.unanswered.filter(u=>(u.coach||'Unassigned')===name).sort((a,b)=>b.waitingMin-a.waitingMin);
  const cs=((c.discord||{}).coachStats||{})[name]||{}, chans=(c.discord||{}).channels||{}, mine=Object.entries(chans).filter(([id,v])=>v.coach===name&&!v.general), crCh=new Set(cr.map(r=>r.x.channelId).filter(Boolean));
  const checks=[], add=o=>checks.push({items:[],...o}), nm=r=>r.x.channel||r.x.name, scanned=c.discordScannedAt||S.sample, scanAt=+new Date(c.discordScannedAt||now);
  const active=cr.filter(r=>r.s.k==='posting'||r.s.k==='idle'), TFL=tfLabel(tf), WK=tf==='7d'||tf==='lw', CUSTR=tf==='custom'||String(tf).startsWith('r:'), RANGE=tf==='lw'||tf==='30d'||CUSTR;
  const inWin=d=>{const t=dayStart(d)+12*H;return t>=t0&&t<t1&&d<chiDate(now)}; // whole days only: today is still in progress
  // history coverage: the scan reads the latest messages in each channel, so long windows may not be fully loaded
  const covered=mine.filter(([id,v])=>(v.msgs||0)<45||(v.oldestMsgAt&&+new Date(v.oldestMsgAt)<=t0)||(snow(id)||0)>=t0).length, cov=mine.length?covered/mine.length:1;
  const covNote=cov<.9?` · history loaded for ${Math.round(cov*100)}% of channels`:'';

  // 1. no creator left over 15h
  const waitIn=u=>tf==='today'||(now-u.waitingMin*6e4>=t0&&now-u.waitingMin*6e4<t1);

/* ---------- Mac Mini status: online, Chrome, failures (sidebar bottom; a strip on phones) ---------- */
function statusLines(){
  if(!live)return [];
  const out=[], rn=S.runner||{}, age=runnerAge(), q=S.queue||[], fin=a=>+new Date(a.finishedAt||a.startedAt||a.createdAt);
  if(age==null)out.push({k:'bad',t:'Mac Mini has never checked in'});
  else if(age<2)out.push({k:'on',t:'Mac Mini online'});
  else out.push({k:age>30?'bad':'off',t:'Mac Mini seen '+ago(rn.lastPollAt),s:'Asleep, off, updating, or nobody logged in'});
  // what the Mac Mini is doing right now, and what's waiting
  const run=q.filter(a=>a.status==='running'), mins=a=>Math.max(0,Math.round((Date.now()-+new Date(a.startedAt||a.createdAt))/6e4)), long=(a,lim)=>mins(a)>lim?' · taking longer than usual':'';
  run.filter(a=>a.type==='audit').forEach(a=>out.push({k:'busy',t:`Writing campaign audit · ${wait(mins(a))}`,s:(mins(a)>=16?'Past the 15-min limit: probably stopped. ':'In the background, no window opens. ')+'Click for progress',job:a.id}));
  run.filter(a=>a.type==='rescan').slice(0,1).forEach(a=>out.push({k:'busy',t:`Scanning: ${describeScope(a.runScope||a.scope)} · ${wait(mins(a))}`,s:'In a Chrome tab on the Mac Mini'+long(a,25),menu:true}));
  const snd=run.filter(a=>a.live);if(snd.length)out.push({k:'busy',t:`Sending ${plural(snd.length,'reply')} · ${wait(Math.max(...snd.map(mins)))}`,s:'Typing in Discord in a Chrome tab on the Mac Mini'+long(snd[0],10)});
  const wq=q.filter(a=>a.status==='pending'&&(a.type==='rescan'||a.type==='audit'||a.live));
  if(wq.length)out.push({k:'busy',t:`${plural(wq.length,'job')} waiting`,s:wq.map(a=>a.type==='audit'?'campaign audit':a.live?'reply':describeScope(a.scope)).slice(0,3).join(', ')+(run.length?' · starts when the current one finishes':age!=null&&age<2?' · starts within 30 seconds':' · starts when the Mac Mini checks in'),menu:!wq.every(a=>a.type==='audit'),job:wq.every(a=>a.type==='audit')?wq[0].id:null});
  if(age!=null&&age<2&&rn.chrome===false)out.push({k:'off',t:'Chrome is closed',s:'Scans and sends will fail until Chrome is open on the Mac Mini'});
  else if(age!=null&&age<2&&rn.chrome===true)out.push({k:'on',t:'Chrome open'});
  // the most recent finished scan failed (any later success clears it)
  const sc=q.filter(a=>a.type==='rescan'&&['done','failed'].includes(a.status)).sort((a,b)=>fin(b)-fin(a))[0];
  if(sc&&sc.status==='failed')out.push({k:'bad',t:`Last scan failed ${ago(sc.finishedAt)}`,s:sc.detail||'no reason given',menu:true});
  const sf=q.filter(a=>a.live&&a.status==='failed'&&Date.now()-fin(a)<24*H);
  if(sf.length)out.push({k:'bad',t:`${plural(sf.length,'message')} failed to send`,s:sf[0].detail||'',href:'#'+(sf[0].campaign==='coaches'?'coaches':sf[0].campaign+(MINE.includes(sf[0].campaign)?'/queue':''))});
  const au=q.filter(a=>a.type==='audit'&&['done','failed'].includes(a.status)).sort((a,b)=>fin(b)-fin(a))[0];
  if(au&&au.status==='failed')out.push({k:'bad',t:'Campaign audit failed '+ago(au.finishedAt),s:(au.detail||'')+' · click for details',job:au.id});
  return out;
}

const perTf=p=>!p||p.kind==='lw'?'lw':p.kind==='7d'?'7d':`r:${p.from}:${p.to}`;
const perLabel=p=>!p||p.kind==='lw'?tfLabel('lw'):p.kind==='7d'?'Last 7 days':tfLabel(perTf(p));

  const lw=per.kind==='lw'?c.lastWeek:per.kind==='7d'?(c.scannedAt?{views:c.views7d,posts:(c.postsByDay||[]).reduce((a,d)=>a+(d.posts||0),0),cpm:c.cpm,creators:c.creators.filter(x=>x.posts7d>0).length,note:'Last 7 days · no comparison week'}:null)
    :(c.creators.some(x=>x.d30)?{views:null,posts:c.creators.reduce((a,x)=>a+(dsum(x)||0),0),cpm:null,creators:c.creators.filter(x=>dsum(x)>0).length,note:"Custom dates · LaunchPoint views and CPM aren't collected for custom ranges"}:null);
  const last=queue().filter(a=>a.type==='audit').sort((a,b)=>+new Date(b.createdAt)-+new Date(a.createdAt))[0];
  const next=au?new Date(+new Date(au.generatedAt)+48*H):null;

const scoreOf=a=>{const g=a.all.filter(x=>x.state!=='na'),ok=g.filter(x=>x.state==='ok').length,wn=g.filter(x=>x.state==='warn').length;return {score:g.length?Math.round((ok+wn/2)/g.length*100):null,ok,graded:g.length}};

function coachSummary(c,a){

/* ---------- progress bar ---------- */
function phasesFor(scope){
  if(scope==='all')return [['lp','LaunchPoint',3.5,'lpAt'],['discord','Discord',14,'discordAt'],['slack','Slack',1.5,'finishedAt']];
  if(/^channel:/.test(scope))return [['discord','Discord channel',2.5,'finishedAt']];
  if(scope==='dms')return [['discord','Discord DMs',3,'finishedAt']];
  if(scope==='slack')return [['slack','Slack',3,'finishedAt']];
  if(scope==='coaches')return [['discord','Coaches server',3,'finishedAt']];
  const p=CAMPS.includes(scope)?['lp.'+scope,'dc.'+scope]:scope.slice(6).split(','), out=[];
  const lp=p.filter(x=>x.startsWith('lp.')).length, dc=p.filter(x=>x.startsWith('dc.')).length, dms=p.includes('dms'), co=p.includes('coaches'), sl=p.includes('slack');
  if(lp)out.push(['lp','LaunchPoint',2+lp*.4,'lpAt']);
  if(dc||dms||co)out.push(['discord','Discord',(out.length?0:2)+dc*3+(dms?1:0)+(co?3:0),'discordAt']);
  if(sl)out.push(['slack','Slack',(out.length?0:2)+1.5,'at']);
  return out.length?out:[['x','Scan',3,'finishedAt']];
}
function progressInfo(){
  if(!live)return null;
  const now=Date.now(), rs=(S.queue||[]).filter(a=>a.type==='rescan'), a=rs.reduce((m,x)=>!m||+new Date(x.createdAt)>+new Date(m.createdAt)?x:m,null);
  const running=rs.find(x=>x.status==='running'), cur=running||a; if(!cur)return null;
  const scope=cur.runScope||cur.scope||'all', name=describeScope(scope)+(cur.source==='schedule'?' · scheduled':'');
  const ph=phasesFor(scope), total=ph.reduce((s,p)=>s+p[2],0), age=runnerAge();
  const steps=ph.map(p=>({label:p[1],ok:false}));
  if(cur.status==='pending'){
    const waited=(now-new Date(cur.createdAt))/60000; if(waited>120)return null;
    const off=age==null||age>2;
    return {name,steps,state:off?'late':'run',pct:2,text:off?`Waiting for the Mac Mini · not seen ${age==null?'yet':'for '+wait(Math.round(age))}. Is it awake?`:'Queued · the Mac Mini picks it up within 30 seconds'};
  }
  if(cur.status==='done'||cur.status==='failed'||cur.status==='cancelled'){
    const fin=cur.finishedAt?+new Date(cur.finishedAt):0; if(!fin||now-fin>(cur.status==='done'?90000:15*60000))return null;
    if(cur.status==='done')return {name,steps:steps.map(s=>({...s,ok:true})),state:'done',pct:100,text:'Done · results updated'};
    return {name,steps,state:'late',pct:100,text:'Failed'+(cur.detail?': '+cur.detail:'')};
  }
  const t0=+new Date(cur.startedAt||cur.createdAt), st=S.scanStatus||{}, mins=(now-t0)/60000, hit=k=>st[k]&&+new Date(st[k])>=t0-5000?+new Date(st[k]):0;
  let acc=0,prev=t0,cp=ph[ph.length-1];
  ph.forEach((p,i)=>{steps[i].ok=!!hit(p[3])});
  for(const p of ph){const h=hit(p[3]);if(h){acc+=p[2];prev=Math.max(prev,h);continue}cp=p;break}
  const frac=Math.min(.95,(now-prev)/60000/cp[2]), pct=Math.max(3,Math.round((acc+frac*cp[2])/total*100));
  steps.forEach((s,i)=>s.now=!s.ok&&ph[i]===cp);
  if(mins>total*2+5)return {name,steps,state:'late',pct,text:`Still running after ${Math.round(mins)} min · it may be stuck (logged out somewhere?). Freed automatically after 40 min.`};
  return {name,steps,state:'run',pct,text:(acc===0&&mins<1.5?'Starting on the Mac Mini':'Scanning '+cp[1])+` · about ${Math.max(1,Math.round(total-mins))} min left`};
}
function renderProgress(){

  if(!p){if(el.innerHTML)el.innerHTML='';return}
  const steps=p.steps.length>1?p.steps.map(s=>`<span class="${s.ok?'ok':s.now?'now':''}">${s.ok?'✓ ':''}${esc(s.label)}</span>`).join(''):'';
  let box=el.querySelector('.prog');

}

  else if(d.sendreply){const c=camp(d.camp),u=c&&c.unanswered.concat(c.tagged||[]).find(x=>x.id===d.sendreply),ta=$('#d_'+CSS.escape(d.sendreply)),text=ta?ta.value:'';
    if(!u)return;if(!text.trim())return toast('Write a reply first');if(text.length>2000)return toast('Too long: Discord allows 2000 characters');
    if(await act([{type:'discord_send',live:true,campaign:c.id,creator:u.creator,channel:u.channel,channelId:u.channelId,guildId:c.guildId||GUILD[c.id],text}])){toast(live?'Queued · the Mac Mini sends it as you':'Send queued (preview)');render()}}
  else if(d.clearq){const sc=d.clearq==='scans';
    if(!confirm(sc?'Cancel every scan that is still waiting? A scan already running keeps going.':`Clear the ${d.camp?NAMES[d.camp]+' ':''}queue? Waiting messages are cancelled (not sent) and finished ones are removed from the list. A message being sent right now can't be stopped.`))return;
    if(!live){localQueue=localQueue.filter(a=>sc?a.type!=='rescan':a.type==='rescan');toast('Cleared (preview)');return render()}
    try{const r=await fetch('api/actions/clear',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({kind:d.clearq,campaign:d.camp||null})}),j=await r.json();if(!r.ok)throw new Error(j.error);
      toast(sc?(j.cancelled?`Cancelled ${plural(j.cancelled,'waiting scan')}`:'No scans were waiting'):`Queue cleared · ${j.cancelled} cancelled, ${j.removed} removed`);if(sc)$('#menu').classList.remove('on');await load()}catch(e){toast('Failed: '+e.message)}}
  else if(d.rcamp){RCAMP=d.rcamp;render()}
  else if(d.runaudit){if(await act([{type:'audit',range:arangeReq()}])){toast(live?'Audit queued · the Mac Mini writes it once it is free (a few minutes)':'Audit queued (preview)');render()}}
  else if(d.cof){COF=d.cof;render()}
  else if(d.rank){OPENR.has(d.rank)?OPENR.delete(d.rank):OPENR.add(d.rank);render()}
  else if(d.sendcoach){const it=(S.coachItems||[]).find(x=>x.id===d.sendcoach),ta=$('#d_'+CSS.escape(d.sendcoach)),text=ta?ta.value:'';
    if(!it)return;if(!text.trim())return toast('Write a reply first');if(text.length>2000)return toast('Too long: Discord allows 2000 characters');
    if(await act([{type:'discord_send',live:true,campaign:'coaches',creator:it.from,channel:it.channel,channelId:it.channelId,guildId:(S.coaches||{}).guildId||'1552479657566142566',text}])){toast(live?'Queued · the Mac Mini sends it as you':'Send queued (preview)');render()}}
  else if(d.sendwelcome){const c=camp(d.camp),r=newJoiners(c).find(y=>y.x.id===d.sendwelcome);if(!r)return;const text=fill($('#wl_text').value,r.x.name);
    if(!text.trim())return toast('Write the welcome first');
    if(await act([{type:'discord_send',live:true,campaign:c.id,creator:r.x.name,channel:r.x.channel,channelId:r.x.channelId,guildId:c.guildId||GUILD[c.id],text}])){toast(live?'Welcome queued · the Mac Mini sends it as you':'Send queued (preview)');render()}}
  else if(d.copyreply){const text=$('#d_'+CSS.escape(d.copyreply)).value;if(!text.trim())return toast('Write a reply first');if(await copy(text)){copied.add(d.copyreply);toast('Reply copied · paste it in Discord');if(d.url)window.open(d.url,'_blank','noopener');render()}}
  else if(d.welcome){const c=camp(d.camp),x=newJoiners(c).map(r=>r.x).find(y=>y.id===d.welcome),text=fill($('#wl_text').value,x.name);if(await copy(text)){copied.add('w'+x.id);toast('Welcome copied · paste it in '+(x.channel||'their channel'));const u=chanUrl(c,x.channelId);if(u)window.open(u,'_blank','noopener');render()}}
  else if(d.copyta){if(await copy($('#'+CSS.escape(d.copyta)).value))toast('Copied')}
  else if(d.bulk){sendTo([...document.querySelectorAll('.pick_'+d.bulk+':checked')].map(i=>i.value),$('#bt_'+d.bulk).value)}
  else if(t.id==='mm_send'){const c=camp('capcut'),a=$('#mm_aud').value;sendTo(c.creators.filter(x=>x.inDiscord&&x.channel&&(a==='all'||(x.postsToday===0&&['posting','idle'].includes(cstat(c,x).k)))).map(x=>x.id),$('#mm_text').value)}
  else if(d.cancel){if(live){await fetch('api/actions/'+d.cancel,{method:'DELETE'});await load()}}
  else if(d.fc){F.camp=d.fc;render()}
  else if(d.ff){F.flag=d.ff;render()}
  else if(d.who){WHO[d.wc]=d.who;render()}
  else if(d.tf){TF=d.tf;render()}
  else if(d.markread){const c=d.camp&&camp(d.camp),u=c&&c.unanswered.concat(c.tagged||[]).find(x=>x.id===d.uid);
    markRead(d.markread,d.label||'',true,u&&u.channelId?{c:c.id,ch:u.channelId,coach:u.coach||'',start:startOf(c,u),last:u.lastAt||null}:null)}
  else if(d.unread)markRead(d.unread,'',false);
  else if(d.showread){SHOWREAD=!SHOWREAD;render()}
});
document.addEventListener('change',e=>{
  const t=e.target,d=t.dataset||{};
  if(t.id==='mm_tpl')$('#mm_text').value=TEMPLATES[t.value].text;
  else if(t.id==='sortsel'){SORT=t.value;render()}
  else if(t.id==='ar_kind'){ARANGE.kind=t.value;if($('#menu').classList.contains('on'))renderMenu();else render()}
  else if(t.id==='ar_from'||t.id==='ar_to'){if(t.value)ARANGE[t.id==='ar_from'?'from':'to']=t.value}
  else if(d.part==='audit'){renderMenu()}
  else if(t.id==='cust_from'||t.id==='cust_to'){if(t.value){CUST[t.id==='cust_from'?'from':'to']=t.value;render()}}
  else if(d.all)document.querySelectorAll('.pick_'+d.all).forEach(i=>i.checked=t.checked);
  else if(d.t){T[d.t]=Number(t.value)||0;try{localStorage.setItem('gk_thresholds',JSON.stringify(T))}catch(e){}render()}
});
document.addEventListener('input',e=>{if(e.target.id==='wl_text'){WLT[e.target.dataset.c]=e.target.value;$('#wl_prev').innerHTML=mentions(fill(e.target.value,'Jordan'))}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('#menu').classList.remove('on');JOB=null;renderJob()}});
addEventListener('hashchange',()=>{render();scrollTo(0,0)});
load();
setInterval(()=>{if(live&&!typing()&&!$('#menu').classList.contains('on'))load()},30000);
</script>
</body>
